name: Release
# Instaladores para Linux, Windows y macOS al publicar una etiqueta vX.Y.Z (o a mano). Crea un borrador de release.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu-22.04, args: '' }
          - { platform: windows-latest, args: '' }
          - { platform: macos-latest, args: '--target aarch64-apple-darwin' }   # Apple Silicon
          - { platform: macos-latest, args: '--target x86_64-apple-darwin' }    # Intel (compilación cruzada desde el runner ARM)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Dependencias del sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cliente de Google integrado (opcional; variables del repositorio, no secretos: acaban en el binario). Sin ellas, Drive pide un ID de cliente propio.
          AULADESK_GOOGLE_CLIENT_ID: ${{ vars.AULADESK_GOOGLE_CLIENT_ID }}
          AULADESK_GOOGLE_CLIENT_SECRET: ${{ vars.AULADESK_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: 'AulaDesk v__VERSION__'
          releaseBody: 'Instaladores sin firmar: Windows (SmartScreen) y macOS (Gatekeeper) mostrarán un aviso. Consulta el README.'
          releaseDraft: true
          args: ${{ matrix.args }}
