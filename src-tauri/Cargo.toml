[package]
name = "auladesk"
version = "0.2.0"
edition = "2021"
description = "Cliente de escritorio para plataformas Moodle: tareas, entregas versionadas, archivos y avisos en local."
license = "MIT"
repository = "https://github.com/AdriLabTech/auladesk"

[[bin]]
name = "auladesk"
path = "src/main.rs"

[lib]
name = "auladesk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite-unbundled", "migrate", "macros", "chrono"] }
# SQLCipher (BD cifrada). Sustituye al SQLite incluido en sqlx; OpenSSL se compila dentro (sin dependencias del sistema).
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
percent-encoding = "2"
base64 = "0.22"
unicode-normalization = "0.1"
keyring = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

# El llavero del sistema depende de cada plataforma
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
